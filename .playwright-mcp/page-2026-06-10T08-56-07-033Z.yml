    - generic [ref=e311]:
      - generic [ref=e312]:
        - button "What is GEO?" [ref=e313] [cursor=pointer]:
          - generic [ref=e314]: What is GEO?
          - img [ref=e315]
        - paragraph [ref=e317]: GEO (Generative Engine Optimization) is the practice of optimizing your digital presence to be discoverable, understood, and cited by AI-powered search engines like ChatGPT, Google Gemini, and Perplexity. It goes beyond traditional SEO by focusing on entity recognition, structured data, and content authority.
      - generic [ref=e318]:
        - button "How is GEO different from SEO?" [ref=e319] [cursor=pointer]:
          - generic [ref=e320]: How is GEO different from SEO?
          - img [ref=e321]
        - paragraph [ref=e323]: While SEO focuses on ranking in traditional search engine results pages, GEO optimizes for AI-generated answers and citations. GEO analyzes entity structures, schema markup, content clarity, and authority signals that AI engines use to generate responses about your business.
      - generic [ref=e324]:
        - button "What platforms do you analyze?" [ref=e325] [cursor=pointer]:
          - generic [ref=e326]: What platforms do you analyze?
          - img [ref=e327]
